name: Release
# A pushed v* tag on main deploys the backend, then the frontend. Each deploy
# waits for the owner's approval in its GitHub environment (R10).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Reads the deploy environments' protection rules below.
      actions: read
    env:
      # Synthetic build configuration, the same as verify.yml. No owner credentials are used.
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      NEXT_TELEMETRY_DISABLED: '1'
      PUBLIC_SITE_ORIGIN: https://public.example
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            exit 1
          fi
      - name: Require the smoke-test handle
        # Checked here so a missing or malformed variable stops the release
        # before anything deploys, not after (same rule as handleSchema).
        env:
          PUBLIC_HANDLE: ${{ vars.PUBLIC_HANDLE }}
        run: |
          handle_pattern='^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$'
          if ! [[ "$PUBLIC_HANDLE" =~ $handle_pattern ]]; then
            echo "Set the PUBLIC_HANDLE repository variable to a published handle (lecturesfrom)."
            exit 1
          fi
      - name: Require protected deploy environments
        # environment: only names an environment, and a same-named repository or
        # org secret would still reach a job whose environment is missing or
        # unprotected. So both environments must exist and require a reviewer
        # before any deploy job starts. An unreadable environment also fails.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in production-backend production-frontend; do
            status="$(curl --silent --output environment.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/$name")"
            if [ "$status" != "200" ]; then
              echo "Could not read the $name environment (HTTP $status). Create it with a required reviewer first."
              exit 1
            fi
            if ! jq -e '[.protection_rules[]? | select(.type == "required_reviewers") | (.reviewers // [])[]] | length > 0' environment.json > /dev/null; then
              echo "The $name environment has no required reviewer. Add one before releasing."
              exit 1
            fi
          done
          rm -f environment.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

  backend:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers on this environment make the owner approve the deploy.
    environment: production-backend
    # Only the two Convex steps receive the key, so npm ci's install scripts never see it.
    steps:
      - name: Require the deploy key
        # A missing-secret check only; verify has already required a reviewer here.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "CONVEX_DEPLOY_KEY is not a secret of the production-backend environment. See docs/releases/v0.2.0.md, One-time setup."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy the Convex backend
        # A deploy key scopes every Convex command to its own deployment, so no --prod.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy -y
      - name: Record the deployed commit
        # Needs the deploy key's deployment:env:write permission as well as deployment:deploy.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex env set DEPLOYED_SHA "$GITHUB_SHA"

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-frontend
    env:
      PUBLIC_HANDLE: ${{ vars.PUBLIC_HANDLE }}
    # Only the two Vercel steps receive the Vercel secrets. The CLI reads them
    # from the environment, so no step passes --token.
    steps:
      - name: Require the Vercel secrets
        # A missing-secret check only; verify has already required a reviewer here.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "$name is not a secret of the production-frontend environment. See docs/releases/v0.2.0.md, One-time setup."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release-tools/package-lock.json
      - name: Install the pinned Vercel CLI
        # Exact version from release-tools/package-lock.json, installed before
        # any secret is in scope and without install scripts.
        run: npm ci --ignore-scripts --prefix release-tools
      - name: Deploy to Vercel production
        # Builds on Vercel, which holds the production values. vercel pull with
        # build --prebuilt can't work: CLERK_SECRET_KEY is a sensitive variable.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOYMENT_URL="$(release-tools/node_modules/.bin/vercel deploy --prod --yes \
            --meta githubCommitSha="$GITHUB_SHA" --meta gitTag="$GITHUB_REF_NAME")"
          # Only a plain deployment URL may reach GITHUB_ENV.
          # [[ =~ ]] tests the whole value, so an extra line is rejected too.
          url_pattern='^https://[a-z0-9-]+\.vercel\.app$'
          if ! [[ "$DEPLOYMENT_URL" =~ $url_pattern ]]; then
            echo "The Vercel CLI did not print a deployment URL."
            exit 1
          fi
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
      - name: Require the production domain on this deployment
        # After an Instant Rollback, new deployments don't take the domain until one is promoted.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          release-tools/node_modules/.bin/vercel inspect "$DEPLOYMENT_URL" > inspect.txt 2>&1
          cat inspect.txt
          if ! grep -Eq '(^|[^.[:alnum:]-])proper-respect\.com([^.[:alnum:]-]|$)' inspect.txt; then
            echo "proper-respect.com is not an alias of $DEPLOYMENT_URL. Promote it or undo the rollback first."
            exit 1
          fi
      - name: Smoke test the live site
        # verify has already checked PUBLIC_HANDLE.
        run: |
          for path in "/" "/$PUBLIC_HANDLE" "/sitemap.xml"; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://proper-respect.com$path")"
            echo "$path -> $status"
            if [ "$status" != "200" ]; then
              echo "Expected 200 from https://proper-respect.com$path."
              exit 1
            fi
          done
