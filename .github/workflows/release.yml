name: Release
# A pushed v* tag on main deploys the backend, then the frontend. Each deploy
# waits for the owner's approval in its GitHub environment (R10).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Reads the deploy environments' protection rules below.
      actions: read
    outputs:
      # The frontend smoke test uses this checked value, not vars.PUBLIC_HANDLE,
      # which an environment-level variable could override there.
      public_handle: ${{ steps.handle.outputs.value }}
      # The backend deploy key must belong to this deployment.
      convex_deployment: ${{ steps.convex_deployment.outputs.value }}
    env:
      # Synthetic build configuration, the same as verify.yml. No owner credentials are used.
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      NEXT_TELEMETRY_DISABLED: '1'
      PUBLIC_SITE_ORIGIN: https://public.example
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            exit 1
          fi
      - name: Require the smoke-test handle
        id: handle
        # Checked here so a missing or malformed variable stops the release
        # before anything deploys, not after (same rule as handleSchema).
        env:
          PUBLIC_HANDLE: ${{ vars.PUBLIC_HANDLE }}
        run: |
          handle_pattern='^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$'
          if ! [[ "$PUBLIC_HANDLE" =~ $handle_pattern ]]; then
            echo "Set the PUBLIC_HANDLE repository variable to a published handle (lecturesfrom)."
            exit 1
          fi
          echo "value=$PUBLIC_HANDLE" >> "$GITHUB_OUTPUT"
      - name: Require the production Convex URL
        id: convex_deployment
        # K02's repository variable. The backend deploy key must belong to the
        # deployment it names.
        env:
          PUBLIC_CONVEX_URL: ${{ vars.PUBLIC_CONVEX_URL }}
        run: |
          # Convex deployment names are adjective-animal-number, e.g. striped-chicken-693.
          convex_url_pattern='^https://([a-z]+-[a-z]+-[0-9]+)\.convex\.cloud$'
          if ! [[ "$PUBLIC_CONVEX_URL" =~ $convex_url_pattern ]]; then
            echo "Set the PUBLIC_CONVEX_URL repository variable to the production Convex URL (https://<deployment>.convex.cloud)."
            exit 1
          fi
          # This job has no environment, so vars can fall back to an org-level
          # variable naming another deployment. The production deployment is
          # pinned; moving it takes a reviewed change here.
          expected_deployment='striped-chicken-693'
          if [ "${BASH_REMATCH[1]}" != "$expected_deployment" ]; then
            echo "PUBLIC_CONVEX_URL must be https://$expected_deployment.convex.cloud."
            exit 1
          fi
          echo "value=$expected_deployment" >> "$GITHUB_OUTPUT"
      - name: Require protected deploy environments
        # environment: only names an environment, and a same-named repository or
        # org secret would still reach a job whose environment is missing or
        # unprotected. So both environments must exist and require a reviewer
        # before any deploy job starts. An unreadable environment also fails.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in production-backend production-frontend; do
            status="$(curl --silent --output environment.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/$name")"
            if [ "$status" != "200" ]; then
              echo "Could not read the $name environment (HTTP $status). Create it with a required reviewer first."
              exit 1
            fi
            # The repository owner must be the only required reviewer: another
            # user or a team could otherwise approve a production deploy.
            # prevent_self_review would stop the owner, who pushes the tag, from
            # approving their own release, so the run would wait forever.
            if ! jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
              [.protection_rules[]? | select(.type == "required_reviewers")] as $rules
              | [$rules[] | (.reviewers // [])[]] as $reviewers
              | ($reviewers | length > 0)
                and ($reviewers | all(.type == "User" and .reviewer.login == $owner))
                and ($rules | all(.prevent_self_review != true))
            ' environment.json > /dev/null; then
              echo "The $name environment must require $GITHUB_REPOSITORY_OWNER, and only $GITHUB_REPOSITORY_OWNER, as reviewer, with \"Prevent self-review\" off."
              exit 1
            fi
          done
          rm -f environment.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

  backend:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers on this environment make the owner approve the deploy.
    environment: production-backend
    # Only the two Convex steps receive the key, so npm ci's install scripts never see it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Convex CLI comes from the lockfile; --no-install below fails
      # rather than download a different version.
      - run: npm ci
      - name: Deploy the Convex backend
        # A deploy key scopes every Convex command to its own deployment, so no --prod.
        # verify has already required the owner as reviewer here. The key is
        # checked in this step, before the CLI runs, so no other step holds it:
        # a dev key or another deployment's key would deploy somewhere else
        # while the release looked successful.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_PRODUCTION_DEPLOYMENT: ${{ needs.verify.outputs.convex_deployment }}
        run: |
          if [ -z "$CONVEX_PRODUCTION_DEPLOYMENT" ]; then
            echo "verify did not pass the production deployment name."
            exit 1
          fi
          case "$CONVEX_DEPLOY_KEY" in
            "prod:${CONVEX_PRODUCTION_DEPLOYMENT}|"?*) ;;
            *)
              echo "CONVEX_DEPLOY_KEY must be a production key for $CONVEX_PRODUCTION_DEPLOYMENT. See docs/releases/v0.2.0.md, One-time setup."
              exit 1
              ;;
          esac
          npx --no-install convex deploy -y
      - name: Record the deployed commit
        # Needs the deploy key's deployment:env:write permission as well as deployment:deploy.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx --no-install convex env set DEPLOYED_SHA "$GITHUB_SHA"

  frontend:
    needs: [verify, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-frontend
    env:
      PUBLIC_HANDLE: ${{ needs.verify.outputs.public_handle }}
    # Only the Vercel steps receive the token and IDs. The CLI reads them from
    # the environment, so no step passes --token.
    steps:
      - name: Require the proper-respect project's IDs
        # verify has already required the owner as reviewer here. The IDs are
        # K02's environment variables, but a missing one falls back to a
        # repository or org variable, so each must equal the project's known
        # ID, not just be non-empty. The token is checked in the deploy step.
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          # The groundskeep team and its proper-respect project (brief K02).
          expected_org='team_MfB5K2Npy5oy5SFJ2g9nbL5W'
          expected_project='prj_yxsUnnPW0ka8mkFr7l66eUSzJgT8'
          if [ "$VERCEL_ORG_ID" != "$expected_org" ]; then
            echo "VERCEL_ORG_ID must be $expected_org. Set it on the production-frontend environment."
            exit 1
          fi
          if [ "$VERCEL_PROJECT_ID" != "$expected_project" ]; then
            echo "VERCEL_PROJECT_ID must be $expected_project. Set it on the production-frontend environment."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: release-tools/package-lock.json
      - name: Install the pinned Vercel CLI
        # Exact version from release-tools/package-lock.json, installed before
        # any secret is in scope and without install scripts.
        run: npm ci --ignore-scripts --prefix release-tools
      - name: Deploy to Vercel production
        # Builds on Vercel, which holds the production values. vercel pull with
        # build --prebuilt can't work: CLERK_SECRET_KEY is a sensitive variable.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # The deployment the backend job just deployed, checked by verify.
          CONVEX_URL: https://${{ needs.verify.outputs.convex_deployment }}.convex.cloud
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set on the production-frontend environment. See docs/releases/v0.2.0.md, One-time setup."
            exit 1
          fi
          # Bind this build and its runtime to the checked backend, whatever
          # NEXT_PUBLIC_CONVEX_URL Vercel's project settings hold.
          DEPLOYMENT_URL="$(release-tools/node_modules/.bin/vercel deploy --prod --yes \
            --build-env NEXT_PUBLIC_CONVEX_URL="$CONVEX_URL" --env NEXT_PUBLIC_CONVEX_URL="$CONVEX_URL" \
            --meta githubCommitSha="$GITHUB_SHA" --meta gitTag="$GITHUB_REF_NAME")"
          # Only a plain deployment URL may reach GITHUB_ENV.
          # [[ =~ ]] tests the whole value, so an extra line is rejected too.
          # One DNS label: letters and digits at both ends, hyphens only inside.
          url_pattern='^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?\.vercel\.app$'
          if ! [[ "$DEPLOYMENT_URL" =~ $url_pattern ]]; then
            echo "The Vercel CLI did not print a deployment URL."
            exit 1
          fi
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
      - name: Require the production domain on this deployment
        # After an Instant Rollback, new deployments don't take the domain until one is promoted.
        # Reads the aliases from Vercel's API. In v0.2.0 the CLI's inspect command failed here and hid why.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: |
          host="${DEPLOYMENT_URL#https://}"
          status="$(curl -sS -o deployment.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${host}?teamId=${VERCEL_ORG_ID}")" || status="000"
          if [ "$status" != "200" ]; then
            echo "Vercel's API answered HTTP $status for $host, so the production domain can't be confirmed. Check the token's team scope."
            exit 1
          fi
          # Print only the URL and aliases, never the rest of the deployment record.
          jq -c '{url, alias}' deployment.json
          if ! jq -e '(.alias // []) | index("proper-respect.com") != null' deployment.json > /dev/null; then
            echo "proper-respect.com is not an alias of $DEPLOYMENT_URL. Promote it or undo the rollback first."
            exit 1
          fi
          echo "proper-respect.com serves $DEPLOYMENT_URL."
      - name: Smoke test the live site
        # PUBLIC_HANDLE is the value verify checked.
        run: |
          for path in "/" "/$PUBLIC_HANDLE" "/sitemap.xml"; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://proper-respect.com$path")"
            echo "$path -> $status"
            if [ "$status" != "200" ]; then
              echo "Expected 200 from https://proper-respect.com$path."
              exit 1
            fi
          done
