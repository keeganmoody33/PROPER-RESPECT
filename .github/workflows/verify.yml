name: Verify application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codex-connection-prototype:
    name: Synthetic Codex connection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.codex-connection.config.ts
      - name: Retain synthetic connection browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-connection-browser-proof
          path: test-results/codex-connection/
          if-no-files-found: error
          retention-days: 7
  public-mcp-prototype:
    name: Local public MCP prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototypes/public-mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix prototypes/public-mcp
      - run: npm --prefix prototypes/public-mcp run typecheck
      - run: npm --prefix prototypes/public-mcp run lint
      - run: npm --prefix prototypes/public-mcp run build
      - run: npm --prefix prototypes/public-mcp test
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix prototypes/public-mcp run test:e2e
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Synthetic build configuration. No deployment or owner credentials are used.
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      NEXT_TELEMETRY_DISABLED: '1'
      PUBLIC_SITE_ORIGIN: https://public.example
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify the pinned release CLI without credentials
        run: |
          npm ci --ignore-scripts --prefix release-tools
          node scripts/check-release-cli.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/e2e/components.config.ts
      - name: Retain synthetic first-result browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-result-browser-proof
          path: test-results/components/**/first-result-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain synthetic GitHub consent browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-consent-browser-proof
          path: test-results/components/**/github-consent-*.png
          if-no-files-found: ignore
          retention-days: 7
      - run: npx playwright test --config tests/e2e/cursor-environment.config.ts
      - run: npx playwright test --config playwright.usage-preview.config.ts
      - run: npx playwright test tests/e2e/public-metadata.spec.ts tests/e2e/homepage.spec.ts tests/e2e/public-profile.spec.ts tests/e2e/product-icons.spec.ts tests/e2e/discovery.spec.ts tests/e2e/webmcp-contract.spec.ts tests/e2e/trust-pages.spec.ts tests/e2e/site-frame.spec.ts tests/e2e/site-identity.spec.ts tests/e2e/inventory.spec.ts tests/e2e/security-headers.spec.ts
      - run: npx playwright test --config tests/e2e/trust-preview.config.ts
      - run: npx playwright test --config tests/e2e/searchable-analytics.config.ts
      - name: Verify production homepage representation negotiation
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          CLERK_SECRET_KEY: ""
          NEXT_PUBLIC_CONVEX_URL: ""
          PROPER_RESPECT_E2E_REFERENCE: "1"
          NEGOTIATION_PRODUCTION: "1"
        run: |
          npm run build -- --webpack
          npx playwright test --config tests/e2e/markdown-negotiation.config.ts
  native-webmcp:
    name: Native Chrome WebMCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test --config tests/native-webmcp/config.ts
