name: Verify application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Jobs run on Blacksmith runners (docs.blacksmith.sh/blacksmith-runners/overview).
# ubuntu-2604 matches the ubuntu-26.04 image ubuntu-latest gave these jobs. The heavy
# jobs take 4 vCPU, the size GitHub gives public repositories; the two short jobs take 2.
# setup-node's npm cache goes to Blacksmith's cache with no change here.
# The Blacksmith GitHub app is installed on the lecturesfrom organization, which owns this repository.
# Playwright installs browsers without --with-deps: that flag runs apt-get update, and on Blacksmith's
# 26.04 image the Ubuntu archives answered so slowly that every job hit its timeout in that step
# (run 45156536006). This relies on the image carrying the browser libraries. If one is missing, the
# browser launch fails with Playwright's "missing dependencies" error rather than passing quietly.
jobs:
  codex-connection-prototype:
    name: Synthetic Codex connection
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --config playwright.codex-connection.config.ts
      - name: Retain synthetic connection browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-connection-browser-proof
          path: test-results/codex-connection/
          if-no-files-found: error
          retention-days: 7
  public-mcp-prototype:
    name: Local public MCP prototype
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototypes/public-mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix prototypes/public-mcp
      - run: npm --prefix prototypes/public-mcp run typecheck
      - run: npm --prefix prototypes/public-mcp run lint
      - run: npm --prefix prototypes/public-mcp run build
      - run: npm --prefix prototypes/public-mcp test
      - run: npx playwright install chromium
      - run: npm --prefix prototypes/public-mcp run test:e2e
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    env:
      # Synthetic build configuration. No deployment or owner credentials are used.
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      NEXT_TELEMETRY_DISABLED: '1'
      PUBLIC_SITE_ORIGIN: https://public.example
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify the pinned release CLI without credentials
        run: |
          npm ci --ignore-scripts --prefix release-tools
          node scripts/check-release-cli.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test --config tests/e2e/components.config.ts
      - name: Retain synthetic first-result browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-result-browser-proof
          path: test-results/components/**/first-result-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain synthetic GitHub consent browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-consent-browser-proof
          path: test-results/components/**/github-consent-*.png
          if-no-files-found: ignore
          retention-days: 7
  browser:
    # Split from verify so each fits its 15 minutes. Every check here starts its own dev server or
    # production build, so none needs the build verify makes.
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    env:
      # Synthetic build configuration. No deployment or owner credentials are used.
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      NEXT_TELEMETRY_DISABLED: '1'
      PUBLIC_SITE_ORIGIN: https://public.example
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --config tests/e2e/cursor-environment.config.ts
      - run: npx playwright test --config playwright.usage-preview.config.ts
      - run: npx playwright test --config tests/e2e/trust-preview.config.ts
      - run: npx playwright test --config tests/e2e/searchable-analytics.config.ts
      - name: Verify production homepage representation negotiation
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          CLERK_SECRET_KEY: ""
          NEXT_PUBLIC_CONVEX_URL: ""
          PROPER_RESPECT_E2E_REFERENCE: "1"
          NEGOTIATION_PRODUCTION: "1"
        run: |
          npm run build -- --webpack
          npx playwright test --config tests/e2e/markdown-negotiation.config.ts
  browser-specs:
    # The default config's spec list ran past browser's 15 minutes on CI, so it runs here in thirds at once.
    # With two halves, shard 2 ran its tests for about 228s against shard 1's 108s and held up every run.
    name: browser-specs (${{ matrix.shard }}/3)
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Synthetic build configuration. No deployment or owner credentials are used.
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      NEXT_TELEMETRY_DISABLED: '1'
      PUBLIC_SITE_ORIGIN: https://public.example
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/3 tests/e2e/public-metadata.spec.ts tests/e2e/homepage.spec.ts tests/e2e/public-profile.spec.ts tests/e2e/product-icons.spec.ts tests/e2e/usage-examples.spec.ts tests/e2e/discovery.spec.ts tests/e2e/webmcp-contract.spec.ts tests/e2e/trust-pages.spec.ts tests/e2e/site-frame.spec.ts tests/e2e/site-identity.spec.ts tests/e2e/inventory.spec.ts tests/e2e/security-headers.spec.ts tests/e2e/usage-chart-skeleton.spec.ts
  native-webmcp:
    name: Native Chrome WebMCP
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Current stable Chrome from Google's package, put in place with dpkg. `playwright install chrome`
      # runs apt-get update first, which hung this job for 15 minutes on Blacksmith (run 45159219203).
      # dpkg fails loudly if a library Chrome needs is missing.
      - name: Install current stable Chrome
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/google-chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/google-chrome.deb"
          google-chrome --version
      - run: npx playwright test --config tests/native-webmcp/config.ts
