name: Cursor report fixtures
on:
  pull_request:
    paths:
      - .github/workflows/cursor-report-fixture.yml
      - src/server/cursor-report/**
      - src/domain/canonical-json.ts
      - src/domain/exact-json.ts
      - src/domain/collector-contract.ts
      - src/domain/connection-history.ts
      - package.json
      - package-lock.json
      - .nvmrc
  push:
    branches: [main]
    paths:
      - .github/workflows/cursor-report-fixture.yml
      - src/server/cursor-report/**
      - src/domain/canonical-json.ts
      - src/domain/exact-json.ts
      - src/domain/collector-contract.ts
      - src/domain/connection-history.ts
      - package.json
      - package-lock.json
      - .nvmrc
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cursor-report-fixture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    name: Synthetic Cursor report tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # The shared collector contract is in-tree. Locked dependencies are required
      # for its schema. Never fetch or import an unmerged branch to fill a gap.
      - name: Install dependencies for the merged collector contract
        run: npm ci --ignore-scripts
      - name: Verify synthetic Cursor reports
        run: node --experimental-strip-types --test --test-reporter spec --test-reporter-destination stdout --test-reporter tap --test-reporter-destination "$RUNNER_TEMP/cursor-report.tap" src/server/cursor-report/*.test.mjs
      - name: Fail if collector-bridge tests skip
        run: node --experimental-strip-types src/server/cursor-report/assert-test-counts.ts "$RUNNER_TEMP/cursor-report.tap"
